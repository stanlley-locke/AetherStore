services:
  db:
    image: postgres:14-alpine
    container_name: aether-db
    environment:
      POSTGRES_DB: ${DB_NAME:-aether}
      POSTGRES_USER: ${DB_USER:-aether}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aether} -d ${DB_NAME:-aether}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aether-network

  redis:
    image: redis:7-alpine
    container_name: aether-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aether-network

  backend:
    build: .
    container_name: aether-backend
    environment:
      - SERVICE_TYPE=web
      - DB_HOST=db
      - REDIS_HOST=redis
      - DB_NAME=${DB_NAME:-aether}
      - DB_USER=${DB_USER:-aether}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - .:/app
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/storage/health/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - aether-network

  celery-worker:
    build: .
    container_name: aether-worker
    environment:
      - SERVICE_TYPE=worker
      - DB_HOST=db
      - REDIS_HOST=redis
      - DB_NAME=${DB_NAME:-aether}
      - DB_USER=${DB_USER:-aether}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - .:/app
      - media_volume:/app/media
    depends_on:
      - db
      - redis
    networks:
      - aether-network

  celery-beat:
    build: .
    container_name: aether-beat
    environment:
      - SERVICE_TYPE=beat
      - REDIS_HOST=redis
    volumes:
      - .:/app
    depends_on:
      - redis
    networks:
      - aether-network

  # Storage Nodes
  node-1:
    build: .
    container_name: aether-node-1
    environment:
      - SERVICE_TYPE=node
      - NODE_ID=node-1
      - NODE_PORT=8001
      - REDIS_HOST=redis
    ports:
      - "8001:8001"
    volumes:
      - node1_data:/app/data/shards
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - aether-network

  node-2:
    build: .
    container_name: aether-node-2
    environment:
      - SERVICE_TYPE=node
      - NODE_ID=node-2
      - NODE_PORT=8002
      - BOOTSTRAP_NODE=node-1:8001
      - REDIS_HOST=redis
    ports:
      - "8002:8002"
    volumes:
      - node2_data:/app/data/shards
    depends_on:
      node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - aether-network

  node-3:
    build: .
    container_name: aether-node-3
    environment:
      - SERVICE_TYPE=node
      - NODE_ID=node-3
      - NODE_PORT=8003
      - BOOTSTRAP_NODE=node-1:8001
      - REDIS_HOST=redis
    ports:
      - "8003:8003"
    volumes:
      - node3_data:/app/data/shards
    depends_on:
      node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - aether-network

  node-4:
    build: .
    container_name: aether-node-4
    environment:
      - SERVICE_TYPE=node
      - NODE_ID=node-4
      - NODE_PORT=8004
      - BOOTSTRAP_NODE=node-1:8001
      - REDIS_HOST=redis
    ports:
      - "8004:8004"
    volumes:
      - node4_data:/app/data/shards
    depends_on:
      node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - aether-network

  node-5:
    build: .
    container_name: aether-node-5
    environment:
      - SERVICE_TYPE=node
      - NODE_ID=node-5
      - NODE_PORT=8005
      - BOOTSTRAP_NODE=node-1:8001
      - REDIS_HOST=redis
    ports:
      - "8005:8005"
    volumes:
      - node5_data:/app/data/shards
    depends_on:
      node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8005/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - aether-network

  node-6:
    build: .
    container_name: aether-node-6
    environment:
      - SERVICE_TYPE=node
      - NODE_ID=node-6
      - NODE_PORT=8006
      - BOOTSTRAP_NODE=node-1:8001
      - REDIS_HOST=redis
    ports:
      - "8006:8006"
    volumes:
      - node6_data:/app/data/shards
    depends_on:
      node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8006/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - aether-network

volumes:
  postgres_data:
  redis_data:
  media_volume:
  node1_data:
  node2_data:
  node3_data:
  node4_data:
  node5_data:
  node6_data:

networks:
  aether-network:
    driver: bridge
