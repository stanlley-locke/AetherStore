services:
  db:
    image: postgres:14-alpine
    container_name: aether-db
    environment:
      POSTGRES_DB: ${DB_NAME:-aether}
      POSTGRES_USER: ${DB_USER:-aether}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aether} -d ${DB_NAME:-aether}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aether-network

  redis:
    image: redis:7-alpine
    container_name: aether-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aether-network

  backend:
    build: .
    container_name: aether-backend
    environment:
      - SERVICE_TYPE=web
      - DB_HOST=db
      - REDIS_HOST=redis
      - DB_NAME=${DB_NAME:-aether}
      - DB_USER=${DB_USER:-aether}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - .:/app
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aether-network

  celery-worker:
    build: .
    container_name: aether-worker
    environment:
      - SERVICE_TYPE=worker
      - DB_HOST=db
      - REDIS_HOST=redis
      - DB_NAME=${DB_NAME:-aether}
      - DB_USER=${DB_USER:-aether}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - .:/app
      - media_volume:/app/media
    depends_on:
      - db
      - redis
    networks:
      - aether-network

  celery-beat:
    build: .
    container_name: aether-beat
    environment:
      - SERVICE_TYPE=beat
      - REDIS_HOST=redis
    volumes:
      - .:/app
    depends_on:
      - redis
    networks:
      - aether-network

  # Storage Nodes
  node-1:
    build: .
    container_name: aether-node-1
    environment:
      - SERVICE_TYPE=node
      - NODE_ID=node-1
      - NODE_PORT=8001
      - REDIS_HOST=redis
    ports:
      - "8001:8001"
    volumes:
      - node1_data:/app/data/shards
    depends_on:
      - backend
    networks:
      - aether-network

  node-2:
    build: .
    container_name: aether-node-2
    environment:
      - SERVICE_TYPE=node
      - NODE_ID=node-2
      - NODE_PORT=8002
      - BOOTSTRAP_NODE=node-1:8001
      - REDIS_HOST=redis
    ports:
      - "8002:8002"
    volumes:
      - node2_data:/app/data/shards
    depends_on:
      - node-1
    networks:
      - aether-network

volumes:
  postgres_data:
  redis_data:
  media_volume:
  node1_data:
  node2_data:

networks:
  aether-network:
    driver: bridge
